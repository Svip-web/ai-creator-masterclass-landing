<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#6d3ce7">
  <title>Запис майстер-класу «Стань AI-CREATOR»</title>
  <meta name="description" content="Дивіться запис майстер-класу Жені Коваленко: як створювати AI-фото та відео для брендів і заробляти 1000–2000€ з дому.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="AI-CREATOR · Женя Коваленко">
  <meta property="og:locale" content="uk_UA">
  <meta property="og:title" content="Запис майстер-класу «Стань AI-CREATOR»">
  <meta property="og:description" content="Як створювати AI-фото та відео для брендів і заробляти 1000–2000€ з дому.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%236d3ce7'/%3E%3Ctext x='32' y='44' text-anchor='middle' font-family='Arial' font-weight='bold' font-size='36' fill='white'%3EAI%3C/text%3E%3C/svg%3E">
  <link rel="preload" href="{{FONT_LATIN}}" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{{FONT_CYRILLIC}}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{CSS_URL}}">
  <script defer src="./config.js"></script>
  <script defer src="{{TRACKING_URL}}"></script>
</head>
<body>
  <main class="hero">
    <div class="hero__glow hero__glow--top" aria-hidden="true"></div>
    <div class="hero__glow hero__glow--bottom" aria-hidden="true"></div>
    <section class="hero__content" aria-labelledby="page-title">
      <div class="hero__copy">
        <p class="eyebrow"><span></span>Ваш безпечний старт у нейромережах</p>
        <h1 id="page-title">Стань <em>AI-CREATOR</em> і заробляй <em>1000–2000€</em>, створюючи фото та відео для брендів</h1>
        <button class="cta" type="button" data-open-modal aria-haspopup="dialog">Залишити заявку</button>
      </div>
      <div class="video-card" data-video-container>
        <button class="video-preview" type="button" data-video-play aria-label="Переглянути запис майстер-класу">
          <img src="{{POSTER_960}}" srcset="{{POSTER_480}} 480w, {{POSTER_960}} 960w, {{POSTER_1440}} 1440w" sizes="(max-width: 560px) calc(100vw - 48px), (max-width: 900px) 90vw, 50vw" width="960" height="540" alt="Женя Коваленко — запис майстер-класу AI-CREATOR" decoding="async" fetchpriority="high">
          <span class="video-preview__play" aria-hidden="true"></span>
          <span class="video-preview__caption">Переглянути запис</span>
        </button>
      </div>
    </section>
  </main>

  <div class="modal" data-modal aria-hidden="true" inert>
    <div class="modal__backdrop" data-close-modal></div>
    <section class="modal__dialog" role="dialog" aria-modal="true" aria-labelledby="modal-title" tabindex="-1">
      <button class="modal__close" type="button" aria-label="Закрити вікно" data-close-modal></button>
      <div class="modal__copy">
        <p class="eyebrow eyebrow--modal"><span></span>Ваш новий шлях починається тут</p>
        <h2 id="modal-title"><em>Ваш шлях у світ ШІ</em> та нейромереж починається разом із професією AI-креатора</h2>
        <div class="timer" aria-label="До завершення реєстрації">
          <div><strong data-hours>00</strong><span>годин</span></div><b aria-hidden="true">:</b>
          <div><strong data-minutes>15</strong><span>хвилин</span></div><b aria-hidden="true">:</b>
          <div><strong data-seconds>00</strong><span>секунд</span></div>
        </div>
      </div>
      <form class="modal__form" data-record-form data-name="smartsender" data-no-redirect method="post" novalidate>
        <label for="record-name"><span>Ім’я</span><input id="record-name" type="text" name="name" autocomplete="name" placeholder="Ваше ім’я" maxlength="100" required></label>
        <label for="record-phone"><span>Телефон</span><input id="record-phone" type="tel" name="phone" autocomplete="tel" placeholder="50 123 45 67" inputmode="tel" aria-describedby="record-phone-hint" required><small class="phone-hint" id="record-phone-hint" data-phone-hint>Код +380 вже вибрано — повторювати його не потрібно. Повний номер із кодом теж приймається.</small></label>
        <label for="record-email"><span>Email</span><input id="record-email" type="email" name="email" autocomplete="email" placeholder="example@gmail.com" maxlength="254" required></label>
        <p class="form-error" data-form-error role="alert" hidden></p>
        <button class="cta cta--form" type="submit" data-submit>Почати свій шлях у ШІ</button>
      </form>
      <div class="modal__success" data-record-success role="status" aria-live="polite" tabindex="-1" hidden>Дякуємо! Заявку успішно надіслано!</div>
    </section>
  </div>
  <noscript><p class="noscript">Для перегляду відео та надсилання заявки увімкніть JavaScript у браузері. <a href="https://iframe.mediadelivery.net/embed/733258/f8a64702-67fa-4f4a-8bf3-9b6577cddb92">Відкрити відео окремо</a>.</p></noscript>
  <script type="module" src="{{APP_URL}}"></script>
</body>
</html>
